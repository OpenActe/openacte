name = "actesskey"
directory = "actesskey"
repository = "https://github.com/grosjeanbaptiste/actesskey"
kind = "cli"
binary = "actesskey"
role = "Secrets, keys and passwords of the machine in one place: age-encrypted blobs in a store, the age key in the macOS Keychain; values travel on stdin, never on a command line. Replaces dotfiles secret slice by slice. Does not log in to anything itself (actessh, actparc ask it for a credential when they need one)."
readme = "actesskey/README.md"
usage = [
  "actesskey init | remove <name> | verify | recipient add <age1…> [--label L] | recipient list | recipient remove <age1…> | rekey | backup-key <file> | restore-key <file> | github <name> <owner/repo> [--as SECRET] | push [name] | target <name> <path> [--mode M] | apply [name] | add <name> [--replace] | add-pair <name> p12|ssh <file> [--replace] | import <dir> --identity <file> | get <name> | list [--age] [--expiring]",
]
