role = "Legal reasoning engine, Belgian law first: from a need or a file, find the applicable texts, reason about how they apply, answer with citations. Orchestrates specialised repositories (one per legal domain), consumed by tag or rev. Takes the addresses of legal sources from actindexer and reads and cites them through kag; it does not hold either itself."
