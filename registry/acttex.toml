name = "acttex"
directory = "acttex"
repository = "https://github.com/grosjeanbaptiste/acttex"
kind = "cli"
binary = "acttex"
role = "LaTeX engine: finds the main .tex file and runs pdflatex, biber and makeglossaries (initial, compile, rebuild). Does not choose between project kinds (actmake calls it)."
readme = "acttex/README.md"
usage = [
  "acttex <initial|compile|rebuild> [main.tex]",
]
