name = "actserve"
directory = "actserve"
repository = "https://github.com/grosjeanbaptiste/actserve"
kind = "service"
binary = "actserve"
role = "Universal Rust orchestrator for the administration of remote servers: domain names (registrars), DNS zones and records, Let Encrypt TLS certificates, WireGuard tunnels, declarative automation engines (OpenTofu, Ansible, Crossplane) and reuse of existing administration repositories, behind a REST API for actserve-ui. Does not provision the local machine (dotfiles) nor run the media pipeline (actcast)."
readme = "actserve/README.md"
