name = "actrepo"
directory = "actrepo"
repository = "https://github.com/grosjeanbaptiste/actrepo"
kind = "cli"
binary = "actrepo"
role = "Manages git repositories by reusing what exists: scaffolding, checking, renaming, workspaces, pull requests, install. Does not carry the stack verbs docker, db and redis (actstack) nor multi-step forge workflows (actautoma)."
readme = "actrepo/README.md"
usage = [
  "actrepo <command>; commands listed by `actrepo --help`",
]
