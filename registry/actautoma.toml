name = "actautoma"
directory = "actautoma"
repository = "https://github.com/grosjeanbaptiste/actautoma"
kind = "cli"
binary = "actautoma"
role = "Automation around the repository-hosting platforms (gh, glab): the gh adapter, ship (push, pull request, gate, merge) and rename-repo; adaptive workflows are its stated direction (ROADMAP). Does not run the gates itself (actcdi); the caller names the gate."
readme = "actautoma/README.md"
usage = [
  "actautoma rename-repo OWNER/OLD NEW [--dir OLD_DIR] [--root DIR]... [--children DIR]... [--registry FILE] [--bin-dir DIR] [--into DIR] [--local-only] [--dry-run]",
]
