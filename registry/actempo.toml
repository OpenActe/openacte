name = "actempo"
directory = "actempo"
repository = "https://github.com/grosjeanbaptiste/actempo"
kind = "cli"
binary = "actempo"
role = "Scheduler of acts for agentic sessions: given acts (units of agent work with dependencies, priority, deadline, release time, allowed providers, token cost) and sessions (each of a provider, one act at a time, providers with a token budget), it returns a plan: which act runs on which session, when, and which acts could not be placed and why. Nothing is dropped silently."
readme = "actempo/README.md"
usage = [
  "actempo lock RESOURCE... --owner NAME [--shared] [--locks DIR]",
  "actempo unlock --owner NAME [--locks DIR]",
  "actempo locks [--locks DIR]",
  "actempo run --acts FILE --providers FILE [--tick-ms N] [--locks DIR] [--budget] [--live-sessions] ...",
]
