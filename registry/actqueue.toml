name = "actqueue"
directory = "actqueue"
repository = "https://github.com/grosjeanbaptiste/actqueue"
kind = "cli"
binary = "actqueue"
role = "Job queues: the heavy queue and its lanes (quick, medium, dotfiles, heavy, heavy2), the slots, who waits behind whom, running a job in its turn and returning its exit code (actqueue run, report, state). Does not decide when a job should run (actempo plans, actqueue executes in turn), run the gates (actcdi) nor supervise long processes (actserve)."
readme = "actqueue/README.md"
usage = [
  "actqueue report | state | run [--quick|--medium] [--name <label>] [--wait-max <seconds>] -- <command> [args...]",
]
