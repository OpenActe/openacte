name = "actcdi"
directory = "actcdi"
repository = "https://github.com/grosjeanbaptiste/actcdi"
kind = "scaffold"
role = "Executes CI/CD for every repository: runs the pre-commit and pre-push gates (lint, tests, builds), shards a suite and selects the tests to run from the changes. Does not hold the test index (dotfiles test-index), plan (actempo), queue heavy jobs (actqueue) nor supervise processes (actserve)."
readme = "actcdi/README.md"
