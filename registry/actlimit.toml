name = "actlimit"
directory = "actlimit"
repository = "https://github.com/grosjeanbaptiste/actlimit"
kind = "cli"
binary = "actlimit"
role = "Shows the current usage limits of the coding agents (Claude, Codex, agents with a token budget) as one line each, fast enough for a shell prompt. Does not forecast or plan the week (actusext)."
readme = "actlimit/README.md"
usage = [
  "actlimit refresh [agent...]",
  "actlimit show [agent...]",
  "actlimit prompt [agent...]",
  "--live keeps only the agents with a process running now",
]
