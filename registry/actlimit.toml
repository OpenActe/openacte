name = "actlimit"
directory = "actlimit"
repository = "https://github.com/grosjeanbaptiste/actlimit"
kind = "cli"
binary = "actlimit"
role = "Shows the usage limits of the coding agents (Claude, Codex, and the agents with a token budget) as one line each, fast enough for a shell prompt."
readme = "actlimit/README.md"
usage = [
  "actlimit refresh [agent...]",
  "actlimit show [agent...]",
  "actlimit prompt [agent...]",
  "--live keeps only the agents with a process running now",
]
